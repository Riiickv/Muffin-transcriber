<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Muffin - Welcome</title>
  <link rel="stylesheet" href="muffin.css" />
  <script src="bridge.js"></script>
  <script src="muffin.js" defer></script>
</head>
<body>
  <!--
    First-run setup: pick the models that make the app work.

    Three pages rather than one long list, because "download four AI models" is
    the single most alien thing this app asks of anyone, and a wall of options
    with sizes in gigabytes is where a normal person closes the app. One
    question per page, each with a suggestion already picked out for this PC.

    No Skip: the models ARE the app. Nothing here works without them, and a skip
    button would only lead to a screen that cannot do anything.

    Downloads keep running as you page through, because they are hundreds of
    megabytes and a wizard that made you sit and watch each one would be slower
    than no wizard at all.
  -->
  <div class="setup-shell">
    <div class="setup-scroll" id="scroll">
      <div class="setup-page" id="page">
        <h1 class="setup-title" id="title"></h1>
        <p class="setup-body" id="body"></p>

        <div id="content">
          <div class="group" id="list-main"></div>

          <div id="optional" hidden>
            <h2 class="setup-section" data-i18n="setup.chatSectionTitle">Chat model!</h2>
            <p class="setup-body left" id="chat-note" data-i18n="pc.setup.chatUsesFormatter">On a PC the chat uses the formatter model you picked, so there is nothing extra to download here.</p>

            <h2 class="setup-section spaced" data-i18n="setup.butlerSectionTitle">Butler!</h2>
            <p class="setup-body left" data-i18n="setup.butlerBody">This will help you extract useful content from the transcriptions, like important dates. The text will be highlighted, so keep an eye out for it!</p>
            <div class="group" id="list-embedding"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Pinned: the model list scrolls for a while, and a Next button at the
         bottom of it would be a hunt. -->
    <div class="setup-footer">
      <button class="btn setup-btn" id="back" data-i18n="setup.back">Back</button>
      <button class="btn btn-accent setup-btn" id="next" data-i18n="setup.next">Next!</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="shell.js" defer></script>
  <script src="models.js" defer></script>
  <script>
    // The English is the fallback, the same as the markup on every other
    // screen, so the wizard still reads correctly if a string is missing.
    var PAGES = [
      {
        group: "whisper",
        title: ["setup.transcriberTitle", "Transcriber!"],
        body: ["setup.transcriberBody", "This is your transcriber.\n\nThe highlighted one is suggested for your device, but you can download as many as you want."],
      },
      {
        group: "formatter",
        title: ["setup.formatterTitle", "Formatter and Summarizer!"],
        body: ["setup.formatterBody", "This is the brain of your transcriptions. It fixes them for you! You can even tell it how you want them.\n\nThe highlighted one is suggested for your device, but you can download as many as you want."],
      },
      {
        group: "embedding",
        title: ["setup.optionalTitle", "Optional!"],
        body: ["setup.optionalBody", "A few optional but useful tools you might need!"],
      },
    ];

    var page = 0;
    var catalog = null;
    var mainList = null;
    var embeddingList = null;

    Muffin.ready(function () {
      mainList = createModelList(document.getElementById("list-main"), {
        highlightRecommended: true,
        onChanged: reload,
      });
      embeddingList = createModelList(document.getElementById("list-embedding"), {
        highlightRecommended: true,
        onChanged: reload,
      });
      reload();
    });

    function reload() {
      Muffin.invoke("models.list").then(function (models) {
        // Render the wizard even if the catalog never arrives. Bailing here
        // left a blank window with a Next button and no explanation.
        catalog = models || { whisper: [], formatter: [], embedding: [] };
        render();
      });
    }

    function render() {
      var current = PAGES[page];
      document.getElementById("title").textContent = Muffin.t(current.title[0], current.title[1]);
      document.getElementById("body").textContent = Muffin.t(current.body[0], current.body[1]);

      var isOptional = page === PAGES.length - 1;
      document.getElementById("optional").hidden = !isOptional;
      document.getElementById("list-main").hidden = isOptional;

      if (isOptional) embeddingList.render(catalog.embedding);
      else mainList.render(catalog[current.group]);

      document.getElementById("back").disabled = page === 0;
      document.getElementById("next").textContent = isOptional
        ? Muffin.t("setup.finish", "Start!")
        : Muffin.t("setup.next", "Next!");

      // Each page fades in as its own step; without it only the text swaps and
      // it reads as a glitch rather than as moving forward.
      var el = document.getElementById("page");
      el.classList.remove("stepped");
      void el.offsetWidth;
      el.classList.add("stepped");
      document.getElementById("scroll").scrollTop = 0;
    }

    Muffin.on("retranslate", function () { if (catalog) render(); });

    document.getElementById("back").addEventListener("click", function () {
      if (page === 0) return;
      page--;
      render();
    });

    document.getElementById("next").addEventListener("click", function () {
      if (page < PAGES.length - 1) {
        page++;
        render();
        return;
      }
      // Done. The app records it and moves the UI itself, so the flag is on
      // disk before anything navigates.
      if (!Muffin.isHosted) { location.href = "index.html"; return; }
      Muffin.invoke("setup.finish");
    });
  </script>
</body>
</html>
