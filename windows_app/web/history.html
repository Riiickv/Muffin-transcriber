<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Muffin - History</title>
  <link rel="stylesheet" href="muffin.css" />
  <script src="bridge.js"></script>
  <script src="muffin.js" defer></script>
</head>
<body>
  <div class="app">
    <nav class="rail" data-tip-place="right">
      <button class="rail-item" data-nav="index.html" data-i18n-attr="title:tabs.transcribe" title="Muffin!"><span class="msr">&#xE88A;</span></button>
      <button class="rail-item active" data-nav="history.html" data-i18n-attr="title:tabs.history" title="History"><span class="msr">&#xE8B3;</span></button>
      <button class="rail-item" data-nav="chat.html" data-i18n-attr="title:tabs.chat" title="Chat"><span class="msr">&#xE0B7;</span></button>
      <div class="rail-spacer"></div>
      <div class="mic-slot">
        <button class="mic-fab" id="mic" data-i18n-attr="title:record.startRecording" title="Start recording"><span class="msr fill">&#xE029;</span></button>
        <div class="mic-timer" id="mic-timer" hidden>0:00</div>
      </div>
      <button class="rail-item" data-nav="settings.html" data-i18n-attr="title:tabs.settings" title="Settings"><span class="msr">&#xE8B8;</span></button>
    </nav>

    <main class="two-pane">
      <aside class="hist-list" id="hist-list">
        <div class="hl-head">
          <h2 data-i18n="history.header">History</h2>
          <div class="search field" id="search" data-field data-single-line contenteditable="plaintext-only"
            data-i18n-attr="placeholder:pc.history.search" placeholder="Search transcripts"></div>
        </div>
        <div class="hl-rows" id="rows"></div>
        <div class="empty" id="empty" hidden>
          <span class="msr empty-icon">&#xE8B3;</span>
          <div data-i18n="pc.history.noResults">No matches.</div>
        </div>
      </aside>

      <div class="splitter" data-min="260" data-max="720" data-persist="HistoryListWidth"></div>

      <section class="hist-detail" id="detail" hidden>
        <!-- Title, date, and the player. -->
        <section class="card">
          <div class="detail-head">
            <div style="min-width:0">
              <h2 id="d-title"></h2>
              <div class="subtitle" id="d-date"></div>
            </div>
            <div style="display:flex; gap:2px;">
              <button class="icon-btn" id="d-rename" data-i18n-attr="title:history.renameAction" title="Rename transcript" style="border:none;padding:6px;"><span class="msr" style="font-size:18px">&#xE3C9;</span></button>
              <button class="icon-btn" id="d-delete" data-i18n-attr="title:history.deleteAction" title="Delete transcript" style="border:none;padding:6px;"><span class="msr" style="font-size:18px">&#xE872;</span></button>
            </div>
          </div>
          <div class="player" id="player" style="margin-bottom:0; margin-top:var(--sp-md);">
            <button class="play-btn" id="play"><span class="msr fill" style="font-size:20px">&#xE037;</span></button>
            <span class="time" id="cur">00:00</span>
            <div class="waveform" id="wave"><div class="wave-handle" id="handle"></div></div>
            <span class="time" id="dur">00:00</span>
          </div>
          <div class="status" id="no-audio" hidden data-i18n="historyDetail.audioMissing">Audio file not found</div>
        </section>

        <!-- The same three actions as the mobile detail screen. -->
        <section class="card">
          <div class="action-row">
            <button class="action-btn" id="a-retranscribe"><span class="msr">&#xE029;</span><span data-i18n="historyDetail.retranscribe">Re-Transcribe</span></button>
            <button class="action-btn" id="a-format"><span class="msr">&#xE65F;</span><span data-i18n="historyDetail.format">Improve</span></button>
            <button class="action-btn" id="a-summarize"><span class="msr">&#xE02F;</span><span data-i18n="historyDetail.summarize">Summarize</span></button>
          </div>

          <hr class="hr" />

          <div class="row">
            <div class="col">
              <span class="lbl" data-i18n="transcribe.languageLabel">Language</span>
              <select id="language" data-setting="DefaultLanguage"></select>
            </div>
            <div class="col">
              <span class="lbl" data-i18n="historyDetail.whisperModelLabel">Transcription quality</span>
              <select id="whisper-model" data-setting="PreferredWhisperModel"></select>
            </div>
          </div>

          <div class="row" style="margin-top: var(--sp-md);">
            <div class="col">
              <span class="lbl" data-i18n="transcribe.formatLanguageLabel">Improvement language</span>
              <select id="format-language" data-setting="FormatLanguage"></select>
            </div>
            <div class="col">
              <span class="lbl" data-i18n="historyDetail.formatterModelLabel">Improvement quality</span>
              <select id="formatter-model" data-setting="PreferredFormatterModel"></select>
            </div>
          </div>

          <hr class="hr" />

          <div class="collapsible">
            <button class="collapsible-head" type="button" aria-expanded="false">
              <span class="lbl" data-i18n="historyDetail.customPromptLabel">Be specific</span>
              <span class="msr chev">&#xE5CF;</span>
            </button>
            <div class="collapsible-body">
              <div class="collapsible-inner"><div class="prompt" id="prompt"
                data-i18n-attr="placeholder:historyDetail.customPromptPlaceholder"
                placeholder="Use bullet points, max 100 words, etc..." data-field contenteditable="plaintext-only"></div></div>
            </div>
          </div>

          <div class="progress" id="d-progress" hidden><i style="width:0%"></i></div>
        </section>

        <!-- Transcript. -->
        <section class="card" id="transcript-card">
          <div class="tabs-row">
            <div class="segmented tabs">
              <button class="segment active" data-tab="raw" data-i18n="historyDetail.rawTab">Raw</button>
              <button class="segment" data-tab="formatted" data-i18n="historyDetail.formattedTab">Improved</button>
              <button class="segment" data-tab="summary" data-i18n="historyDetail.summaryTab">Summary</button>
            </div>
            <div style="display:flex; gap:8px;">
              <button class="icon-btn" data-copy><span class="msr" style="font-size:16px">&#xE14D;</span> <span data-i18n="historyDetail.copyButton">Copy</span></button>
            </div>
          </div>
          <div class="transcript placeholder">Transcript will appear here.</div>
        </section>
      </section>

      <section class="hist-detail empty-detail" id="detail-empty">
        <div class="empty">
          <div data-i18n="history.noHistory">No transcripts yet.</div>
          <div class="empty-sub" data-i18n="history.emptyDesc">Record or transcribe an audio file to see it here.</div>
        </div>
      </section>
    </main>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <div class="toast" id="toast" hidden></div>

  <script src="shell.js" defer></script>
  <script src="transcript.js" defer></script>
  <script>
    var BAR_COUNT = 44;
    var items = [];
    var current = null;
    var panel = null;
    var busy = false;

    Muffin.ready(function () {
      panel = createTranscript(document.getElementById("transcript-card"));
      loadLanguages();
      loadModels();
      refresh(true);
      restoreListWidth();
      restoreBusy();
    });

    function restoreListWidth() {
      var width = Muffin.get("HistoryListWidth");
      if (width) document.getElementById("hist-list").style.width = Math.round(width) + "px";
    }

    function loadLanguages() {
      Muffin.invoke("transcribe.languages").then(function (langs) {
        if (!langs) return;
        var s = Muffin.settings();
        setOptions(document.getElementById("language"),
          langs.transcription.map(function (n) { return { value: n, label: n }; }), s.DefaultLanguage);
        setOptions(document.getElementById("format-language"),
          langs.format.map(function (n) { return { value: n, label: n }; }), s.FormatLanguage);
      });
    }

    function loadModels() {
      Muffin.invoke("models.list").then(function (models) {
        if (!models) return;
        var s = Muffin.settings();
        fill("whisper-model", models.whisper.filter(installed), s.PreferredWhisperModel);
        fill("formatter-model", models.formatter.filter(installed), s.PreferredFormatterModel);
      });
    }

    function installed(m) { return m.installed; }

    function fill(id, models, selected) {
      var sel = document.getElementById(id);
      if (!models.length) {
        setOptions(sel, [{ value: "", label: Muffin.t("models.noneInstalled", "No models installed yet") }], "");
        sel.disabled = true;
        return;
      }
      setOptions(sel, models.map(function (m) { return { value: m.file, label: m.name }; }), selected);
    }

    // ---- list --------------------------------------------------------------

    function refresh(selectFirst) {
      Muffin.invoke("history.list").then(function (list) {
        items = list || [];
        renderList();
        if (selectFirst && items.length) open(items[0].id);
        if (!items.length) showDetail(false);
      });
    }

    function renderList() {
      var query = document.getElementById("search").value.trim().toLowerCase();
      var shown = query
        ? items.filter(function (i) {
            return i.title.toLowerCase().indexOf(query) >= 0 || i.snippet.toLowerCase().indexOf(query) >= 0;
          })
        : items;

      var rows = document.getElementById("rows");
      rows.textContent = "";
      // Only a fruitless SEARCH gets a message here; an empty library
      // says so once, in the detail pane, not twice on one screen.
      document.getElementById("empty").hidden = shown.length > 0 || items.length === 0;

      shown.forEach(function (item) {
        var card = document.createElement("div");
        card.className = "hist-card" + (current && current.id === item.id ? " active" : "");
        // The mobile card: a row of icon, title/date and the two buttons, with
        // the preview on its own line UNDER them, indented past the icon. It is
        // not a third column, which is what kept the preview short and the card
        // tall for no reason.
        card.innerHTML =
          '<div class="h-head">' +
            '<div class="lead"><span class="msr" style="font-size:18px">&#xE1B8;</span></div>' +
            '<div class="h-main">' +
              '<div class="h-title"></div>' +
              '<div class="h-date"></div>' +
            '</div>' +
            '<div class="acts">' +
              '<button data-rename><span class="msr" style="font-size:18px">&#xE3C9;</span></button>' +
              '<button data-delete><span class="msr" style="font-size:18px">&#xE872;</span></button>' +
            '</div>' +
          '</div>' +
          '<div class="h-snippet"></div>';

        card.querySelector(".h-title").textContent = item.title;
        card.querySelector(".h-date").textContent = formatHistoryDate(item.timestamp);
        var snippet = card.querySelector(".h-snippet");
        snippet.textContent = item.snippet;
        // No preview, no empty line reserving room for one.
        snippet.hidden = !item.snippet;
        card.querySelector("[data-rename]").title = Muffin.t("history.renameAction", "Rename transcript");
        card.querySelector("[data-delete]").title = Muffin.t("history.deleteAction", "Delete transcript");

        card.addEventListener("click", function () { open(item.id); });
        card.querySelector("[data-rename]").addEventListener("click", function (e) {
          e.stopPropagation();
          askRename(item);
        });
        card.querySelector("[data-delete]").addEventListener("click", function (e) {
          e.stopPropagation();
          askDelete(item);
        });

        rows.appendChild(card);
      });
    }

    // Renaming happens where the title is, the way the mobile list does it:
    // commit on Enter or blur, cancel on Escape.
    // The library renames in a dialog, the way the mobile library does. It used
    // to swap the title for a bare <input>, which inherited nothing and turned
    // up as a white browser box in the middle of a dark card.
    function askRename(item) {
      showDialog({
        title: Muffin.t("history.renameTranscript", "Rename Transcript"),
        input: { value: item.title },
        buttons: [
          { label: Muffin.t("dialog.confirmDelete.cancel", "Cancel"), variant: "ghost" },
          {
            label: Muffin.t("history.saveRename", "Save"),
            onPress: function (next) {
              if (!next || next === item.title) return;
              Muffin.invoke("history.rename", { id: item.id, title: next }).then(function (list) {
                items = list || items;
                if (current && current.id === item.id) {
                  current.title = next;
                  document.getElementById("d-title").textContent = next;
                }
                renderList();
              });
            },
          },
        ],
      });
    }

    document.getElementById("search").addEventListener("input", renderList);

    // ---- detail ------------------------------------------------------------

    function showDetail(on) {
      document.getElementById("detail").hidden = !on;
      document.getElementById("detail-empty").hidden = on;
    }

    function open(id) {
      Muffin.invoke("history.get", { id: id }).then(function (item) {
        if (!item) return;
        current = item;
        showDetail(true);
        renderList();

        document.getElementById("d-title").textContent = item.title;
        document.getElementById("d-date").textContent = formatHistoryDate(item.timestamp);
        panel.set(item, { preferBest: true });
        setupPlayer(item);
      });
    }

    document.getElementById("d-rename").addEventListener("click", function () {
      // It used to need the card in the list, because the editing happened
      // inside it. Search for something that hides the open transcript and the
      // button did nothing at all.
      if (current) askRename(current);
    });

    document.getElementById("d-delete").addEventListener("click", function () {
      if (current) askDelete(current);
    });

    // ---- delete confirmation -----------------------------------------------

    function askDelete(item) {
      showDialog({
        title: Muffin.t("dialog.confirmDelete.title", "Delete transcript?"),
        message: Muffin.t("dialog.confirmDelete.message", "Are you sure you want to delete this transcript?")
          + ' "' + item.title + '"',
        icon: "", // warning
        iconTone: "danger",
        buttons: [
          { label: Muffin.t("dialog.confirmDelete.cancel", "Cancel"), variant: "ghost" },
          { label: Muffin.t("dialog.confirmDelete.delete", "Delete"), variant: "danger", onPress: function () { doDelete(item.id); } },
        ],
      });
    }

    function doDelete(id) {
      Muffin.invoke("history.delete", { id: id }).then(function (list) {
        items = list || [];
        if (current && current.id === id) { current = null; stopAudio(); }
        renderList();
        if (!current && items.length) open(items[0].id);
        else if (!items.length) showDetail(false);
      });
    }

    // ---- the three actions -------------------------------------------------

    // Which tab each action fills, so the result of the thing you just asked
    // for is the thing you are shown.
    var PRODUCES = {
      "history.retranscribe": "raw",
      "history.format": "formatted",
      "history.summarize": "summary",
    };

    function runAction(method) {
      if (!current || busy) return;
      Muffin.invoke(method, {
        id: current.id,
        prompt: document.getElementById("prompt").value,
        language: method === "history.retranscribe"
          ? document.getElementById("language").value
          : document.getElementById("format-language").value,
      }).then(function (result) {
        // Whatever happened, the screen stops saying "Working...". A job that
        // finished while the UI still claimed to be busy is indistinguishable
        // from one that hung.
        finishBusy();
        if (!result) return;
        if (result.error) { showToast(result.error, "error"); return; }
        current = result;
        var typed = method === "history.retranscribe" && Muffin.get("TypewriterEffect");
        panel.set(result, {
          show: PRODUCES[method],
          animate: !!typed,
          speed: Muffin.get("TypewriterSpeed") || "Balanced",
        });
        refreshRow();
      });
    }

    // A job started before this screen existed, or before you last left it.
    // Every screen is its own document, so nothing survives a tab switch on
    // its own; the app is asked instead.
    function restoreBusy() {
      Muffin.invoke("history.state").then(function (state) {
        if (!state || !state.busy) return;
        busy = true;
        busyAction = state.action;
        busyPercent = state.percent || 0;
        paintActionButtons();
        if (busyPercent > 0) {
          var bar = document.getElementById("d-progress");
          bar.hidden = false;
          bar.firstElementChild.style.width = busyPercent + "%";
        }
        announceBusy();
      });
    }

    function refreshRow() {
      Muffin.invoke("history.list").then(function (list) { items = list || items; renderList(); });
    }

    // A fresh transcript is named a few seconds after it is saved, so the row
    // has to pick the new name up on its own.
    Muffin.on("history.changed", refreshRow);

    document.getElementById("a-retranscribe").addEventListener("click", function () { clickAction("retranscribe"); });
    document.getElementById("a-format").addEventListener("click", function () { clickAction("format"); });
    document.getElementById("a-summarize").addEventListener("click", function () { clickAction("summarize"); });

    // The mobile detail screen names the job and appends the percentage when
    // there is one (utils/transcribeProgress.ts describeProgress). No stopwatch.
    var BUSY_LABEL = {
      retranscribe: ["historyDetail.retranscribing", "Re-transcribing..."],
      format: ["historyDetail.formatting", "Improving..."],
      summarize: ["historyDetail.summarizing", "Summarizing..."],
    };

    var busyAction = null;
    var busyPercent = 0;
    var stopping = false;

    // The running action's own button becomes a red Stop; the other two go
    // grey. A disabled button says "not now"; this says what is happening and
    // offers the way out, which is the only control that makes sense mid-run.
    // Same as the mobile detail screen.
    var ACTION_BUTTONS = {
      retranscribe: { id: "a-retranscribe", glyph: "" },
      format: { id: "a-format", glyph: "" },
      summarize: { id: "a-summarize", glyph: "" },
    };
    var ACTION_LABELS = {
      retranscribe: ["historyDetail.retranscribe", "Re-Transcribe"],
      format: ["historyDetail.format", "Improve"],
      summarize: ["historyDetail.summarize", "Summarize"],
    };

    function paintActionButtons() {
      Object.keys(ACTION_BUTTONS).forEach(function (kind) {
        var spec = ACTION_BUTTONS[kind];
        var el = document.getElementById(spec.id);
        var isRunner = busy && busyAction === kind;

        el.classList.toggle("stop", isRunner);
        el.disabled = busy && (!isRunner || stopping);

        el.querySelector(".msr").textContent = isRunner ? "" : spec.glyph; // stop
        var label = el.querySelector(".msr").nextElementSibling;
        if (isRunner) {
          label.textContent = stopping
            ? Muffin.t("historyDetail.stopping", "Stopping...")
            : Muffin.t("historyDetail.stop", "Stop");
        } else {
          label.textContent = Muffin.t(ACTION_LABELS[kind][0], ACTION_LABELS[kind][1]);
        }
      });
    }

    function clickAction(kind) {
      if (busy && busyAction === kind) {
        // Not awaited into a frozen button: the engines only notice between
        // chunks, so say "Stopping" and let it wind down.
        stopping = true;
        paintActionButtons();
        Muffin.invoke("history.cancel");
        return;
      }
      if (busy) return;
      runAction("history." + kind);
    }

    // Announced once, when the job starts. It used to be a line of text under
    // the buttons, repainted on every percent; the bar right there carries the
    // percentage, so saying it again a hundred times is just noise.
    function busyLabel() {
      var label = BUSY_LABEL[busyAction] || ["historyDetail.working", "Working..."];
      return Muffin.t(label[0], label[1]);
    }

    function announceBusy() {
      showToast(busyLabel());
    }

    // Named the job and its percentage, the way the mobile detail screen does.
    // The notification says it once; this says it for as long as it runs.
    function paintWaiting() {
      if (!panel) return;
      var text = busyLabel();
      if (busyPercent > 0) text += " " + busyPercent + "%";
      panel.waiting(busy, text);
    }

    function finishBusy() {
      busy = false;
      busyAction = null;
      busyPercent = 0;
      stopping = false;
      paintActionButtons();
      paintWaiting();
      document.getElementById("d-progress").hidden = true;
    }

    Muffin.on("history.busy", function (e) {
      busy = e.busy;
      if (busy) {
        busyAction = e.action;
        busyPercent = 0;
        stopping = false;
        paintActionButtons();
        announceBusy();
        paintWaiting();
      } else {
        finishBusy();
      }
    });

    Muffin.on("history.progress", function (e) {
      var bar = document.getElementById("d-progress");
      bar.hidden = false;
      busyPercent = e.percent || 0;
      bar.firstElementChild.style.width = busyPercent + "%";
      paintWaiting();
    });

    Muffin.on("history.partial", function (e) { if (panel) panel.stream(e.tab, e.text); });



    // ---- player ------------------------------------------------------------
    // The bars are the mobile stylised waveform, seeded by the transcript id, so
    // the same recording draws the same shape on both apps. The scrubbing is real.

    var audio = document.getElementById("audio");
    var wave = document.getElementById("wave");
    var handle = document.getElementById("handle");
    var bars = [];
    var seeking = false;
    var dragFrac = null;

    function setupPlayer(item) {
      stopAudio();
      var hasAudio = !!item.audioUrl;
      document.getElementById("player").hidden = !hasAudio;
      document.getElementById("no-audio").hidden = hasAudio;
      if (!hasAudio) return;

      audio.src = item.audioUrl;
      buildBars(item.id);
      paintWave(0);
      document.getElementById("cur").textContent = formatDuration(0);
      document.getElementById("dur").textContent = formatDuration(0);
    }

    function buildBars(seed) {
      wave.querySelectorAll(".bar").forEach(function (b) { b.remove(); });
      bars = [];
      waveformBars(seed, BAR_COUNT).forEach(function (height) {
        var bar = document.createElement("div");
        bar.className = "bar";
        bar.style.height = Math.round(height * 100) + "%";
        wave.insertBefore(bar, handle);
        bars.push(bar);
      });
    }

    function paintWave(frac) {
      handle.style.left = (frac * 100) + "%";
      for (var i = 0; i < bars.length; i++) {
        bars[i].classList.toggle("played", (i + 0.5) / bars.length <= frac);
      }
    }

    function stopAudio() {
      audio.pause();
      audio.removeAttribute("src");
      setPlayIcon(false);
    }

    function setPlayIcon(playing) {
      document.querySelector("#play .msr").textContent = playing ? "" : ""; // pause / play
    }

    document.getElementById("play").addEventListener("click", function () {
      if (!audio.src) return;
      if (audio.paused) audio.play(); else audio.pause();
    });

    audio.addEventListener("play", function () { setPlayIcon(true); });
    audio.addEventListener("pause", function () { setPlayIcon(false); });
    audio.addEventListener("ended", function () { setPlayIcon(false); paintWave(0); });
    audio.addEventListener("loadedmetadata", function () {
      document.getElementById("dur").textContent = formatDuration(audio.duration);
    });
    audio.addEventListener("timeupdate", function () {
      if (seeking || !audio.duration) return;
      paintWave(audio.currentTime / audio.duration);
      document.getElementById("cur").textContent = formatDuration(audio.currentTime);
    });

    // Dragging shows the target live and commits on release, so the audio is
    // not hammered with a seek on every mouse move.
    function fracFrom(e) {
      var r = wave.getBoundingClientRect();
      return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    }

    wave.addEventListener("mousedown", function (e) {
      if (!audio.src) return;
      seeking = true;
      dragFrac = fracFrom(e);
      paintWave(dragFrac);
      e.preventDefault();
    });
    window.addEventListener("mousemove", function (e) {
      if (!seeking) return;
      dragFrac = fracFrom(e);
      paintWave(dragFrac);
      document.getElementById("cur").textContent = formatDuration((audio.duration || 0) * dragFrac);
    });
    window.addEventListener("mouseup", function () {
      if (!seeking) return;
      seeking = false;
      if (audio.duration) audio.currentTime = audio.duration * dragFrac;
      dragFrac = null;
    });
  </script>
</body>
</html>
