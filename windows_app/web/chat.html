<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Muffin - Chat</title>
  <link rel="stylesheet" href="muffin.css" />
  <script src="bridge.js"></script>
  <script src="muffin.js" defer></script>
</head>
<body>
  <div class="app">
    <nav class="rail" data-tip-place="right">
      <button class="rail-item" data-nav="index.html" data-i18n-attr="title:tabs.transcribe" title="Muffin!"><span class="msr">&#xE88A;</span></button>
      <button class="rail-item" data-nav="history.html" data-i18n-attr="title:tabs.history" title="History"><span class="msr">&#xE8B3;</span></button>
      <button class="rail-item active" data-nav="chat.html" data-i18n-attr="title:tabs.chat" title="Chat"><span class="msr">&#xE0B7;</span></button>
      <div class="rail-spacer"></div>
      <button class="mic-fab" id="mic" data-i18n-attr="title:record.startRecording" title="Start recording"><span class="msr fill">&#xE029;</span></button>
      <div class="mic-timer" id="mic-timer" hidden>0:00</div>
      <button class="rail-item" data-nav="settings.html" data-i18n-attr="title:tabs.settings" title="Settings"><span class="msr">&#xE8B8;</span></button>
    </nav>

    <aside class="chat-sessions" id="sessions-pane">
      <button class="btn btn-accent new-chat" id="new-chat">
        <span class="msr" style="font-size:18px">&#xE145;</span> <span data-i18n="chat.newChat">New Chat</span>
      </button>
      <div id="sessions"></div>
      <div class="empty" id="no-chats" hidden>
        <div data-i18n="chat.noChats">No chats yet.</div>
      </div>
    </aside>

    <div class="splitter" data-min="180" data-max="420"></div>

    <section class="chat-main">
      <div class="chat-head">
        <h2 id="chat-title" data-i18n="chat.header">Chat</h2>
        <span class="beta-badge" data-i18n="chat.beta">Beta</span>
      </div>

      <div class="chat-scroll" id="scroll">
        <div class="chat-empty" id="chat-empty" data-i18n="chat.emptyState">You can ask me anything about your transcripts, just tell me what you need!</div>
      </div>

      <div class="composer">
        <textarea id="input" rows="1"
          data-i18n-attr="placeholder:chat.inputPlaceholder"
          placeholder="Ask about your transcripts..."></textarea>
        <button class="send-btn" id="send" data-i18n-attr="title:chat.sendButton" title="Send"><span class="msr fill" style="font-size:20px">&#xE5D8;</span></button>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="confirm" hidden>
    <div class="modal">
      <h2 id="confirm-title" data-i18n="chat.deleteChat">Delete chat</h2>
      <p id="confirm-body"></p>
      <div class="modal-actions">
        <div class="modal-spacer"></div>
        <button class="btn btn-ghost" id="confirm-no" data-i18n="common.cancel">Cancel</button>
        <button class="btn btn-ghost danger" id="confirm-yes" data-i18n="common.delete">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="shell.js" defer></script>
  <script>
    var sessions = [];
    var activeId = null;
    var busy = false;
    var streamBubble = null;
    var firstToken = true;

    Muffin.ready(function () { loadSessions(true); });

    function loadSessions(openFirst) {
      Muffin.invoke("chat.sessions").then(function (list) {
        sessions = list || [];
        renderSessions();
        if (openFirst) {
          if (sessions.length) openSession(sessions[0].id);
          else renderMessages([]);
        }
      });
    }

    function renderSessions() {
      var host = document.getElementById("sessions");
      host.textContent = "";
      document.getElementById("no-chats").hidden = sessions.length > 0;

      sessions.forEach(function (session) {
        var row = document.createElement("div");
        row.className = "session" + (session.id === activeId ? " active" : "");
        row.innerHTML =
          '<div class="s-main"><div class="s-title"></div><div class="s-time"></div></div>' +
          '<div class="s-acts">' +
            '<button data-rename><span class="msr">&#xE3C9;</span></button>' +
            '<button data-delete><span class="msr">&#xE872;</span></button>' +
          '</div>';

        row.querySelector(".s-title").textContent = session.title;
        row.querySelector(".s-time").textContent = formatRelativeTime(session.updatedAt);
        row.querySelector("[data-rename]").title = Muffin.t("chat.renameChat", "Rename chat");
        row.querySelector("[data-delete]").title = Muffin.t("chat.deleteChat", "Delete chat");

        row.addEventListener("click", function () { openSession(session.id); });
        row.querySelector("[data-rename]").addEventListener("click", function (e) {
          e.stopPropagation();
          renameInline(row, session);
        });
        row.querySelector("[data-delete]").addEventListener("click", function (e) {
          e.stopPropagation();
          askDelete(session);
        });

        host.appendChild(row);
      });
    }

    function renameInline(row, session) {
      var main = row.querySelector(".s-main");
      var titleEl = main.querySelector(".s-title");
      if (main.querySelector(".s-edit")) return;

      var input = document.createElement("input");
      input.className = "s-edit";
      input.value = session.title;
      main.replaceChild(input, titleEl);
      input.focus();
      input.select();

      var done = function (commit) {
        if (input.parentNode === main) main.replaceChild(titleEl, input);
        var next = input.value.trim();
        if (!commit || !next || next === session.title) return;
        Muffin.invoke("chat.rename", { id: session.id, title: next }).then(function (list) {
          sessions = list || sessions;
          renderSessions();
        });
      };

      input.addEventListener("click", function (e) { e.stopPropagation(); });
      input.addEventListener("blur", function () { done(true); });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); done(true); }
        if (e.key === "Escape") { e.preventDefault(); done(false); }
      });
    }

    function openSession(id) {
      Muffin.invoke("chat.open", { id: id }).then(function (session) {
        if (!session) return;
        activeId = session.id;
        setHeader(session.title);
        renderSessions();
        renderMessages(session.messages);
      });
    }

    function setHeader(title) {
      document.getElementById("chat-title").textContent =
        title || Muffin.t("chat.header", "Chat");
    }

    document.getElementById("new-chat").addEventListener("click", function () {
      Muffin.invoke("chat.new").then(function (session) {
        if (!session) return;
        activeId = session.id;
        loadSessions(false);
        renderMessages(session.messages);
        document.getElementById("input").focus();
      });
    });

    // ---- messages ----------------------------------------------------------

    function renderMessages(messages) {
      var scroll = document.getElementById("scroll");
      scroll.textContent = "";
      if (!messages || !messages.length) {
        var empty = document.createElement("div");
        empty.className = "chat-empty";
        empty.textContent = Muffin.t("chat.emptyState", "You can ask me anything about your transcripts, just tell me what you need!");
        scroll.appendChild(empty);
        return;
      }
      messages.forEach(function (m) { addBubble(m.role, m.content, m.actions); });
      toBottom();
    }

    // A reply is its text plus, underneath, a chip per tool call it made. The
    // action never replaces the words: answering "hello" with "Done" is what
    // that produced.
    function addBubble(role, text, actions) {
      var scroll = document.getElementById("scroll");
      var empty = scroll.querySelector(".chat-empty");
      if (empty) empty.remove();

      var group = document.createElement("div");
      group.className = "msg " + (role === "user" ? "user" : "assistant");

      var bubble = document.createElement("div");
      bubble.className = "bubble " + (role === "user" ? "user" : "assistant");
      bubble.textContent = text;
      bubble.hidden = !text;
      group.appendChild(bubble);

      renderActions(group, actions);
      scroll.appendChild(group);
      toBottom();

      bubble._group = group;
      return bubble;
    }

    function renderActions(group, actions) {
      group.querySelectorAll(".act-chip, .setting-card").forEach(function (c) { c.remove(); });
      (actions || []).forEach(function (a) {
        // A setting action shows the setting itself, live, the way the mobile
        // chat does. A chip saying "Done: SHOW_SETTING" told the user an action
        // had happened while nothing appeared and nothing was changed.
        if (a.setting) { group.appendChild(settingCard(a.setting)); return; }

        var chip = document.createElement("div");
        chip.className = "act-chip" + (a.ok ? "" : " failed");
        var icon = document.createElement("span");
        icon.className = "msr";
        icon.textContent = a.ok ? "" : ""; // check_circle / warning
        chip.appendChild(icon);
        var label = document.createElement("span");
        label.textContent = a.ok
          ? Muffin.t("chat.actionExecuted", "Done") + ": " + a.action
          : Muffin.t("chat.actionFailed", "Couldn't do that");
        chip.appendChild(label);
        group.appendChild(chip);
      });
    }

    function toBottom() {
      var scroll = document.getElementById("scroll");
      scroll.scrollTop = scroll.scrollHeight;
    }

    function send() {
      if (busy) return;
      var input = document.getElementById("input");
      var text = input.value.trim();
      if (!text) return;

      input.value = "";
      input.style.height = "auto";
      addBubble("user", text);
      streamBubble = addBubble("assistant", Muffin.t("chat.thinking", "Thinking..."));
      firstToken = true;

      Muffin.invoke("chat.send", { id: activeId, text: text }).then(function (result) {
        if (!result) { streamBubble = null; return; }
        activeId = result.id;
        if (result.error) {
          streamBubble.textContent = result.error;
          streamBubble.hidden = false;
        } else {
          streamBubble.textContent = result.text;
          streamBubble.hidden = !result.text;
          renderActions(streamBubble._group, result.actions);
          sessions = result.sessions || sessions;
          renderSessions();
        }
        streamBubble = null;
        toBottom();
      });
    }

    // One listener for the whole page: registering it per send stacked a new
    // handler on every message and echoed the reply once per send.
    Muffin.on("chat.token", function (t) {
      if (!streamBubble) return;
      if (firstToken) { streamBubble.textContent = ""; firstToken = false; }
      streamBubble.textContent += t.text;
      toBottom();
    });

    // The same control as the Settings screen, writing the same setting, so a
    // change here shows up everywhere at once.
    function settingCard(spec) {
      var card = document.createElement("div");
      card.className = "setting-card";
      card._key = spec.key;

      var label = document.createElement("div");
      label.className = "sc-text";
      label.innerHTML = '<div class="sc-label"></div><div class="sc-location"></div>';
      label.querySelector(".sc-label").textContent = spec.label;
      label.querySelector(".sc-location").textContent = spec.location;
      card.appendChild(label);

      var control = document.createElement("div");
      control.className = "sc-control";

      if (spec.type === "boolean") {
        var sw = document.createElement("button");
        sw.className = "switch";
        sw.classList.toggle("on", !!Muffin.get(spec.key));
        sw.setAttribute("aria-pressed", !!Muffin.get(spec.key));
        sw.addEventListener("click", function () {
          var on = !sw.classList.contains("on");
          sw.classList.toggle("on", on);
          sw.setAttribute("aria-pressed", on);
          Muffin.set(spec.key, on);
        });
        control.appendChild(sw);
      } else {
        var sel = document.createElement("select");
        (spec.options || []).forEach(function (o) {
          var opt = document.createElement("option");
          opt.value = o;
          opt.textContent = o;
          sel.appendChild(opt);
        });
        sel.value = String(Muffin.get(spec.key) == null ? "" : Muffin.get(spec.key));
        sel.addEventListener("change", function () { Muffin.set(spec.key, sel.value); });
        control.appendChild(sel);
        // Themed dropdown, same as everywhere else.
        setTimeout(function () { enhanceSelects(control); }, 0);
      }

      card.appendChild(control);
      return card;
    }

    // A setting changed anywhere keeps every control in the chat in step.
    Muffin.on("settings.changed", function () {
      document.querySelectorAll(".setting-card").forEach(function (card) {
        var sw = card.querySelector(".switch");
        var key = card._key;
        if (!key) return;
        if (sw) sw.classList.toggle("on", !!Muffin.get(key));
      });
    });

    Muffin.on("chat.busy", function (e) {
      busy = e.busy;
      var send = document.getElementById("send");
      send.disabled = busy;
      send.querySelector(".msr").textContent = busy ? "" : ""; // more_horiz / arrow_upward
    });

    // The assistant can ask for a transcript to be deleted; the app asks first.
    Muffin.on("chat.confirmDelete", function (e) {
      pending = { kind: "transcript", id: e.id, name: e.name };
      document.getElementById("confirm-title").textContent = Muffin.t("chat.deleteTitle", "Delete transcript?");
      document.getElementById("confirm-body").textContent =
        Muffin.t("chat.deleteMessage", 'Delete "{name}"? This can\'t be undone.').replace("{name}", e.name);
      document.getElementById("confirm").hidden = false;
    });

    document.getElementById("send").addEventListener("click", send);
    document.getElementById("input").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    var textarea = document.getElementById("input");
    textarea.addEventListener("input", function () {
      textarea.style.height = "auto";
      textarea.style.height = Math.min(120, textarea.scrollHeight) + "px";
    });

    // ---- delete confirmation -----------------------------------------------

    var pending = null;
    var confirmModal = document.getElementById("confirm");

    function askDelete(session) {
      pending = { kind: "chat", id: session.id, name: session.title };
      document.getElementById("confirm-title").textContent = Muffin.t("chat.deleteChat", "Delete chat");
      document.getElementById("confirm-body").textContent =
        Muffin.t("chat.deleteMessage", 'Delete "{name}"? This can\'t be undone.').replace("{name}", session.title);
      confirmModal.hidden = false;
    }

    document.getElementById("confirm-no").addEventListener("click", function () { confirmModal.hidden = true; });
    confirmModal.addEventListener("click", function (e) { if (e.target === confirmModal) confirmModal.hidden = true; });

    document.getElementById("confirm-yes").addEventListener("click", function () {
      if (!pending) return;
      confirmModal.hidden = true;

      if (pending.kind === "transcript") {
        Muffin.invoke("history.delete", { id: pending.id });
        showToast(Muffin.t("chat.actionExecuted", "Done"));
        pending = null;
        return;
      }

      var removed = pending.id;
      pending = null;
      Muffin.invoke("chat.delete", { id: removed }).then(function (list) {
        sessions = list || [];
        if (activeId === removed) {
          activeId = sessions.length ? sessions[0].id : null;
          if (activeId) openSession(activeId);
          else renderMessages([]);
        }
        renderSessions();
      });
    });
  </script>
</body>
</html>
