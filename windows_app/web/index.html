<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Muffin</title>
  <link rel="stylesheet" href="muffin.css" />
</head>
<body>
  <div class="app">
    <nav class="rail">
      <button class="rail-item active" title="Muffin!" aria-label="Muffin!">
        <svg viewBox="0 0 24 24"><path d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2"/></svg>
      </button>
      <button class="rail-item" title="History" aria-label="History">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
      </button>
      <button class="rail-item" title="Chat" aria-label="Chat">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <div class="rail-spacer"></div>
      <button class="mic-fab" title="Start recording" aria-label="Start recording">
        <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      </button>
      <button class="rail-item" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </nav>

    <main class="page">
      <div class="page-inner">
        <h1 class="title">Muffin!</h1>

        <section class="card">
          <div class="row">
            <div class="col">
              <p class="field-label">Language</p>
              <select>
                <option>Auto-Detect</option>
                <option>English</option>
                <option>Italiano</option>
              </select>
            </div>
            <div class="col">
              <p class="field-label">Transcription quality</p>
              <select>
                <option>Most accurate</option>
                <option>Balanced</option>
                <option>Fastest</option>
              </select>
            </div>
          </div>
          <div class="row" style="margin-top: var(--sp-lg); align-items: stretch;">
            <div class="drop" id="drop">
              <span>Drag &amp; drop any audio or video file</span>
              <span class="hint">or click to browse</span>
            </div>
            <button class="btn btn-accent" style="min-width: 150px;">Go!</button>
          </div>
        </section>

        <section class="card">
          <div class="row">
            <div class="col">
              <p class="field-label">Be specific</p>
              <textarea placeholder="Use bullet points, max 100 words, etc."></textarea>
            </div>
            <div class="col" style="max-width: 320px;">
              <div class="switch-row" style="margin-bottom: var(--sp-md);">
                <span>Format</span>
                <button class="switch on" data-toggle aria-pressed="true"></button>
              </div>
              <div class="switch-row" style="margin-bottom: var(--sp-lg);">
                <span>Summarize</span>
                <button class="switch" data-toggle aria-pressed="false"></button>
              </div>
              <p class="field-label">Format quality</p>
              <select><option>Balanced</option><option>Best quality</option></select>
              <div style="height: var(--sp-md);"></div>
              <p class="field-label">Format language</p>
              <select><option>Auto-Detect / Original</option></select>
            </div>
          </div>
        </section>

        <section class="card">
          <p class="section-label" style="font-size: 18px; color: var(--text); font-weight: 700;">Transcript</p>
          <div class="tabs-row">
            <div class="segmented tabs">
              <button class="segment active">Raw</button>
              <button class="segment">Formatted</button>
              <button class="segment">Summary</button>
            </div>
            <button class="icon-btn">
              <svg viewBox="0 0 24 24" width="15" height="15"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
              Copy
            </button>
          </div>
          <div class="transcript placeholder">Transcript will appear here.</div>
        </section>
      </div>
    </main>
  </div>

  <script>
    document.querySelectorAll('[data-toggle]').forEach(function (el) {
      el.addEventListener('click', function () {
        el.classList.toggle('on');
        el.setAttribute('aria-pressed', el.classList.contains('on'));
      });
    });
    document.querySelectorAll('.segmented').forEach(function (grp) {
      grp.querySelectorAll('.segment').forEach(function (seg) {
        seg.addEventListener('click', function () {
          grp.querySelectorAll('.segment').forEach(function (s) { s.classList.remove('active'); });
          seg.classList.add('active');
        });
      });
    });
  </script>
</body>
</html>
