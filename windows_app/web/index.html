<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Muffin</title>
  <link rel="stylesheet" href="muffin.css" />
</head>
<body>
  <div class="app">
    <nav class="rail">
      <button class="rail-item active" title="Muffin!" aria-label="Muffin!"><span class="msr">&#xE88A;</span></button>
      <button class="rail-item" title="History" aria-label="History"><span class="msr">&#xE8B3;</span></button>
      <button class="rail-item" title="Chat" aria-label="Chat"><span class="msr">&#xE0B7;</span></button>
      <div class="rail-spacer"></div>
      <button class="mic-fab" title="Start recording" aria-label="Start recording"><span class="msr fill">&#xE029;</span></button>
      <button class="rail-item" title="Settings" aria-label="Settings"><span class="msr">&#xE8B8;</span></button>
    </nav>

    <main class="page">
      <div class="page-inner">
        <h1 class="title">Muffin!</h1>

        <!-- Format card first: configure once, then transcribe. -->
        <section class="card">
          <div class="switch-row">
            <span class="lbl">Format</span>
            <button class="switch on" data-toggle aria-pressed="true"></button>
          </div>
          <div class="switch-row">
            <span class="lbl">Summarize</span>
            <button class="switch" data-toggle aria-pressed="false"></button>
          </div>
          <div class="row">
            <div class="col">
              <span class="lbl">Format quality</span>
              <select><option>Balanced</option><option>Best quality</option></select>
            </div>
            <div class="col">
              <span class="lbl">Format language</span>
              <select><option>Auto-Detect / Original</option></select>
            </div>
          </div>
          <div style="margin-top: var(--sp-lg);">
            <span class="lbl">Be specific</span>
            <textarea class="prompt" placeholder="e.g. Translate to Spanish, use bullet points..."></textarea>
          </div>
        </section>

        <!-- File / engine card. -->
        <section class="card">
          <div class="row">
            <div class="col">
              <span class="lbl">Language</span>
              <select><option>Auto-Detect</option><option>English</option><option>Italiano</option></select>
            </div>
            <div class="col">
              <span class="lbl">Transcription quality</span>
              <select><option>Most accurate</option><option>Balanced</option><option>Fastest</option></select>
            </div>
          </div>
          <div class="row" style="margin-top: var(--sp-lg);">
            <button class="btn col">Pick file</button>
            <button class="btn btn-accent col">Go!</button>
          </div>
        </section>

        <!-- Transcript card. -->
        <section class="card">
          <div class="tabs-row">
            <div class="segmented tabs">
              <button class="segment active">Raw</button>
              <button class="segment">Formatted</button>
              <button class="segment">Summary</button>
            </div>
            <div style="display:flex; gap:8px;">
              <button class="icon-btn"><span class="msr" style="font-size:16px">&#xE14D;</span> Copy</button>
              <button class="icon-btn" title="Fullscreen"><span class="msr" style="font-size:18px">&#xF1CE;</span></button>
            </div>
          </div>
          <div class="transcript placeholder">Transcript will appear here.</div>
        </section>
      </div>
    </main>
  </div>

  <script src="muffin.js"></script>
</body>
</html>
