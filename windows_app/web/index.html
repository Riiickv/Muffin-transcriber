<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Muffin</title>
  <link rel="stylesheet" href="muffin.css" />
  <script src="bridge.js"></script>
  <script src="muffin.js" defer></script>
</head>
<body>
  <div class="app">
    <nav class="rail">
      <button class="rail-item active" data-nav="index.html" data-i18n-attr="title:tabs.transcribe" title="Muffin!"><span class="msr">&#xE88A;</span></button>
      <button class="rail-item" data-nav="history.html" data-i18n-attr="title:tabs.history" title="History"><span class="msr">&#xE8B3;</span></button>
      <button class="rail-item" data-nav="chat.html" data-i18n-attr="title:tabs.chat" title="Chat"><span class="msr">&#xE0B7;</span></button>
      <div class="rail-spacer"></div>
      <button class="mic-fab" id="mic" data-i18n-attr="title:record.startRecording" title="Start recording"><span class="msr fill">&#xE029;</span></button>
      <div class="mic-timer" id="mic-timer" hidden>0:00</div>
      <button class="rail-item" data-nav="settings.html" data-i18n-attr="title:tabs.settings" title="Settings"><span class="msr">&#xE8B8;</span></button>
    </nav>

    <main class="page">
      <div class="page-inner">
        <h1 class="title" data-i18n="tabs.transcribe">Muffin!</h1>

        <!-- Format card first: set it once, then transcribe. Same order as the
             mobile screen, so both apps are learned once. -->
        <section class="card">
          <div class="switch-row">
            <span class="lbl" data-i18n="transcribe.formatToggle">Format</span>
            <button class="switch on" data-setting="FormatByDefault" aria-pressed="true"></button>
          </div>
          <div class="switch-row">
            <span class="lbl" data-i18n="transcribe.summarizeToggle">Summarize</span>
            <button class="switch" data-setting="SummarizeByDefault" aria-pressed="false"></button>
          </div>
          <div class="row">
            <div class="col">
              <span class="lbl" data-i18n="transcribe.formatterModelLabel">Format quality</span>
              <select id="formatter-model" data-setting="PreferredFormatterModel"></select>
            </div>
            <div class="col">
              <span class="lbl" data-i18n="transcribe.formatLanguageLabel">Format Language</span>
              <select id="format-language" data-setting="FormatLanguage"></select>
            </div>
          </div>
          <div style="margin-top: var(--sp-lg);">
            <span class="lbl" data-i18n="settings.customPrompt">Custom prompt</span>
            <textarea class="prompt" data-setting="CustomFormatSystemPrompt"
              placeholder="e.g. Translate to Spanish, use bullet points..."></textarea>
          </div>
        </section>

        <!-- File and engine. -->
        <section class="card" id="file-card">
          <div class="row">
            <div class="col">
              <span class="lbl" data-i18n="transcribe.languageLabel">Language</span>
              <select id="language" data-setting="DefaultLanguage"></select>
            </div>
            <div class="col">
              <span class="lbl" data-i18n="transcribe.whisperModelLabel">Transcription quality</span>
              <select id="whisper-model" data-setting="PreferredWhisperModel"></select>
            </div>
          </div>
          <div class="row" style="margin-top: var(--sp-lg);">
            <button class="btn col" id="pick" data-i18n="transcribe.selectFileButton">Pick file</button>
            <button class="btn btn-accent col" id="go" data-i18n="transcribe.transcribeButton">Go!</button>
          </div>
          <div class="status" id="status" hidden></div>
          <div class="progress" id="progress" hidden><i style="width:0%"></i></div>
        </section>

        <!-- Transcript. -->
        <section class="card" id="transcript-card">
          <div class="tabs-row">
            <div class="segmented tabs">
              <button class="segment active" data-tab="raw" data-i18n="transcribe.rawTab">Raw</button>
              <button class="segment" data-tab="formatted" data-i18n="transcribe.formattedTab">Formatted</button>
              <button class="segment" data-tab="summary" data-i18n="transcribe.summaryTab">Summary</button>
            </div>
            <div style="display:flex; gap:8px;">
              <button class="icon-btn" data-copy><span class="msr" style="font-size:16px">&#xE14D;</span> <span data-i18n="common.copy">Copy</span></button>
            </div>
          </div>
          <div class="transcript placeholder">Transcript will appear here.</div>
        </section>
      </div>
    </main>
  </div>

  <!-- Drop anywhere on the window, like dragging a file onto the app icon. -->
  <div class="dropveil" id="dropveil" hidden>
    <div>
      <span class="msr">&#xF090;</span>
      <div data-i18n="pc.dropCaption">Drop to transcribe</div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="shell.js" defer></script>
  <script src="transcript.js" defer></script>
  <script>
    var panel = null;
    var running = false;

    Muffin.ready(function () {
      panel = createTranscript(document.getElementById("transcript-card"));

      Muffin.invoke("transcribe.languages").then(function (langs) {
        if (!langs) return;
        var s = Muffin.settings();
        setOptions(document.getElementById("language"),
          langs.transcription.map(function (n) { return { value: n, label: n }; }), s.DefaultLanguage);
        setOptions(document.getElementById("format-language"),
          langs.format.map(function (n) { return { value: n, label: n }; }), s.FormatLanguage);
      });

      Muffin.invoke("transcribe.state").then(applyState);
    });

    Muffin.on("transcribe.state", applyState);
    Muffin.on("transcribe.status", function (s) { showStatus(s.text, s.kind); });
    Muffin.on("transcribe.output", function (out) {
      if (!panel) return;
      panel.set(out, { animate: out.animate, speed: out.typewriterSpeed, preferBest: !out.animate });
    });
    Muffin.on("transcribe.partial", function (p) { if (panel) panel.stream(p.tab, p.text); });

    function applyState(state) {
      if (!state) return;
      running = state.running;

      var s = Muffin.settings();
      fillModels("whisper-model", state.whisperModels, s.PreferredWhisperModel);
      fillModels("formatter-model", state.formatterModels, s.PreferredFormatterModel);

      var pick = document.getElementById("pick");
      pick.textContent = state.files.length === 0
        ? Muffin.t("transcribe.selectFileButton", "Pick file")
        : state.files.length === 1
          ? state.files[0]
          : Muffin.t("pc.status.queuedMultiple", "{0} files queued.").replace("{0}", state.files.length);
      pick.disabled = running;

      var go = document.getElementById("go");
      go.textContent = running
        ? Muffin.t("common.cancel", "Cancel")
        : Muffin.t("transcribe.transcribeButton", "Go!");
      go.disabled = !running && !state.canTranscribe;

      var progress = document.getElementById("progress");
      progress.hidden = !running || !state.percent;
      progress.firstElementChild.style.width = (state.percent || 0) + "%";

      if (state.status) showStatus(state.status, state.statusKind);
      if (panel && state.output) panel.set(state.output, { preferBest: true });
    }

    function fillModels(id, models, selected) {
      var sel = document.getElementById(id);
      if (!models) return;
      if (!models.length) {
        setOptions(sel, [{ value: "", label: Muffin.t("models.noneInstalled", "No models installed yet") }], "");
        sel.disabled = true;
        return;
      }
      sel.disabled = false;
      setOptions(sel, models.map(function (m) { return { value: m.file, label: m.name }; }), selected);
    }

    function showStatus(text, kind) {
      var el = document.getElementById("status");
      if (!text) { el.hidden = true; return; }
      el.textContent = text;
      el.className = "status " + (kind || "info");
      el.hidden = false;
    }

    document.getElementById("pick").addEventListener("click", function () {
      Muffin.invoke("transcribe.pickFiles").then(applyState);
    });

    document.getElementById("go").addEventListener("click", function () {
      if (running) {
        Muffin.invoke("transcribe.cancel");
        return;
      }
      Muffin.invoke("transcribe.start").then(applyState);
    });

    // ---- drag and drop -----------------------------------------------------
    // The File objects ride along with the message; C# reads their real paths,
    // which is the only way to get them out of the browser sandbox.

    var veil = document.getElementById("dropveil");
    var depth = 0;

    window.addEventListener("dragenter", function (e) {
      e.preventDefault();
      depth++;
      veil.hidden = false;
    });
    window.addEventListener("dragover", function (e) { e.preventDefault(); });
    window.addEventListener("dragleave", function (e) {
      e.preventDefault();
      depth = Math.max(0, depth - 1);
      if (depth === 0) veil.hidden = true;
    });
    window.addEventListener("drop", function (e) {
      e.preventDefault();
      depth = 0;
      veil.hidden = true;
      var files = e.dataTransfer && e.dataTransfer.files;
      if (!files || !files.length || !window.chrome || !chrome.webview) return;
      chrome.webview.postMessageWithAdditionalObjects("files.dropped", Array.prototype.slice.call(files));
    });
  </script>
</body>
</html>
